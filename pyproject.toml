[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slow-and-steady-tidy"
version = "0.1.0"
description = "A local-first, human-approved AI file tidier powered by Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
sloth-tidy = "sloth_tidy.cli:main"

[tool.setuptools.packages.find]
include = ["sloth_tidy*"]
